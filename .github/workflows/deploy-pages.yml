name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        env:
          CARTO_BASEMAPS_API_KEY: ${{ secrets.CARTO_BASEMAPS_API_KEY }}
        run: |
          test -n "$CARTO_BASEMAPS_API_KEY"
          mkdir dist
          cp index.html data.js README.md validate-data.js dist/
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path("dist/index.html")
          text = path.read_text(encoding="utf-8")
          key = os.environ["CARTO_BASEMAPS_API_KEY"]
          path.write_text(text.replace("__CARTO_BASEMAPS_API_KEY__", key), encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
